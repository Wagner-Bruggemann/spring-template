## EMAIL DEFAULT CONFIG
email:
  subject: "Default Subject"
  message: "Default Message"

## ASSETS DIRECTORY
file:
  upload-dir: ./assets

## CROSS-ORIGIN RESOURCE SHARING
cors:
  originPatterns:
    - http://namgrengaw
    - http://localhost:11000
    - http://localhost:10000

## LOGGER
logging:
  level:
    root: INFO

## JWT CONFIG
security:
  jwt:
    token:
      secret-key: 359ed0821f069202f764e5f4f5430d66f6e1b649c0fbf41f5bf44a2aba52fd6cdabb074cbe097649456137c64e1e4f5bce88
      expire-lenght: 3600000

## PORT CONFIG
server:
  port: 11000

## SPRING
spring:

  application:
    name: template

  ## DATABASE
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:12000/template_db
    username: template_user
    password: template_password

  ## DATABASE VERSIONING
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true

  ## JPA
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show-sql: false
    open-in-view: false

  ## MAIL
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enabled: true
      mail.smtp.starttls.required: true

  ## FILES
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB

## SWAGGER
springdoc:
  enable-hateoas: false
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
